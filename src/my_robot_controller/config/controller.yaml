controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    controller_plugins:
      - FollowPath

    progress_checker_plugins:
      - progress_checker

    goal_checker_plugins:
      - goal_checker

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.22
      lookahead_dist: 0.30
      min_lookahead_dist: 0.20
      max_lookahead_dist: 0.40
      lookahead_time: 1.0
      use_velocity_scaled_lookahead_dist: true
      rotate_to_heading: false
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.3
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.7
      use_interpolation: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      max_robot_pose_search_dist: 10.0